name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip pytest PyYAML

      - name: Test
        run: python test/run_tests.py

  # Every installer is this core plus its own part. A change here is run through
  # stm32-installer's whole suite too, with this core in place of the one it
  # pins, so it cannot break the installer without this failing first.
  stm32-installer:
    name: stm32-installer on this core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: core

      - uses: actions/checkout@v7
        with:
          repository: nimaltd/stm32-installer
          path: stm32-installer

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Put this core in its place
        run: |
          rm -rf stm32-installer/src/stm32_installer/core
          mkdir stm32-installer/src/stm32_installer/core
          cp core/*.py stm32-installer/src/stm32_installer/core/

      - name: Test
        run: |
          python -m pip install --upgrade pip pytest PyYAML
          python stm32-installer/test/run_tests.py
